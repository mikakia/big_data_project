networks:
  galaxy_network:

volumes:
  spark-events:
  spark-logs:

services:
  galaxy-master:
    image: spark:python3
    container_name: galaxy-master
    hostname: galaxy-master
    networks:
      - galaxy_network
    command: 
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "8090:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/spark/work-dir/src:ro
      - ./data:/opt/spark/work-dir/data
      - ./data/master:/data
      - ./data/events:/opt/spark/events
    restart: unless-stopped

  galaxy-worker1:
    image: spark:python3
    container_name: galaxy-worker1
    hostname: galaxy-worker1
    networks:
      - galaxy_network
    depends_on:
      - galaxy-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - galaxy-worker1
      - --cores
      - "2"
      - --memory
      - 2g
      - spark://galaxy-master:7077
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
    volumes:
      - ./src:/opt/spark/work-dir/src:ro
      - ./data:/opt/spark/work-dir/data
      - ./data/worker1:/data
      - ./data/events:/opt/spark/events
    restart: unless-stopped

  galaxy-worker2:
    image: spark:python3
    container_name: galaxy-worker2
    hostname: galaxy-worker2
    networks:
      - galaxy_network
    depends_on:
      - galaxy-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --host
      - galaxy-worker2
      - --cores
      - "4"
      - --memory
      - 4g
      - spark://galaxy-master:7077
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 5g
    volumes:
      - ./src:/opt/spark/work-dir/src:ro
      - ./data:/opt/spark/work-dir/data
      - ./data/worker2:/data
      - ./data/events:/opt/spark/events
    restart: unless-stopped

  # History server
  spark-history-server:
    image: spark:python3
    hostname: galaxy-history
    container_name: galaxy-history
    networks:
      - galaxy_network
    command: 
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=file:/opt/spark/events"
    ports:
      - 18080:18080
    volumes:
      - ./data/events:/opt/spark/events
      - spark-logs:/opt/spark/logs
    restart: unless-stopped
  